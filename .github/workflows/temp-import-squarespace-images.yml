name: Temporary Squarespace image migration
on:
  push:
    branches:
      - fix/migrate-squarespace-images-20261024
permissions:
  contents: write
jobs:
  import-images:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Preserve Squarespace image bytes and update only references
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import html
          import json
          import pathlib
          import re
          import time
          import urllib.request
          
          ROOT = pathlib.Path(".")
          SITE = "https://unitednights.com"
          DOMAINS = ("images.squarespace-cdn.com", "static1.squarespace.com")
          NAMES = {
              "1787100141507-XQRACH092CVXU674RXOW": "united-stories-article",
              "1787321727870-BG9VMT8TNSVEDFR3E265": "why-united-nights",
              "2416aef0-200d-46e7-bf0f-f6e0e8497199": "luke-munns-footer",
              "2f6517ce-938d-4263-bf4a-95d4ec717ff0": "contact-banner",
              "3a0d35ff-cf40-4f06-9450-b90b574a8301": "united-nights-header-logo",
              "3e5eecf8-b02f-4c5e-916a-72f2bee26a69": "blessing-australia",
              "7e289948-8475-493e-90b6-b7a68c406ac9": "join-background",
              "86c8ff0c-b213-49d1-95cd-fdf4fd0a4370": "legal-banner",
              "9502a1d7-8e92-4ca3-b0ff-c946e85981db": "privacy-banner",
              "dd71cdeb-5f7f-4635-9c77-57588ee649b7": "united-gathering",
              "e97d65ae-8eb5-45a3-b177-e178b9c9b715": "favicon",
              "6a8507b3762f55650d9e2518": "stories-social",
              "6a8668b331e02f46bf595841": "united-nights-social",
          }
          pattern = re.compile(r"https?://(?:images\.squarespace-cdn\.com|static1\.squarespace\.com)/[^\s\"'<>\x60\\|]+")
          def name_for(url):
              matches = [name for key, name in NAMES.items() if key in url]
              if len(matches) != 1:
                  raise RuntimeError("Unrecognised or ambiguous image URL: " + url)
              return matches[0]
          def is_image_url(url):
              return "?" in url or url.endswith(".ico")
          paths = []
          urls = set()
          for path in ROOT.rglob("*"):
              if not path.is_file() or ".git" in path.parts or path.suffix.lower() not in {".html", ".css", ".py", ".js", ".txt", ".json", ".md", ".xml"}:
                  continue
              paths.append(path)
              for m in pattern.finditer(path.read_text(encoding="utf-8")):
                  u = html.unescape(m.group()).rstrip("),.;")
                  if u.endswith("/6a6464a7513b006c5a13f402"):
                      continue
                  name_for(u)
                  urls.add(u)
          download_urls = sorted(u for u in urls if is_image_url(u))
          if len(download_urls) != 13:
              raise RuntimeError(f"Expected 13 current rendered files, found {len(download_urls)}: {download_urls}")
          out_paths = {}
          manifest = []
          for source in download_urls:
              name = name_for(source)
              payload = None
              for attempt in range(3):
                  try:
                      req = urllib.request.Request(source, headers={"User-Agent": "Mozilla/5.0 UNITED-Nights-CDN-Migration", "Accept": "image/png,image/jpeg,image/webp,image/x-icon,*/*;q=0.1"})
                      with urllib.request.urlopen(req, timeout=28) as response:
                          payload = response.read()
                          content_type = response.headers.get("Content-Type", "")
                          if response.status != 200:
                              raise RuntimeError(f"Unexpected HTTP {response.status}")
                      break
                  except Exception:
                      if attempt == 2:
                          raise
                      time.sleep(2 * (attempt + 1))
              if payload.startswith(b"RIFF") and payload[8:12] == b"WEBP":
                  ext = "webp"
              elif payload.startswith(b"\x89PNG\r\n\x1a\n"):
                  ext = "png"
              elif payload.startswith(b"\xff\xd8\xff"):
                  ext = "jpg"
              elif payload[:4] in (b"\x00\x00\x01\x00", b"\x00\x00\x02\x00"):
                  ext = "ico"
              else:
                  raise RuntimeError("Unrecognised image bytes for " + source + " " + repr(payload[:16]))
              path = pathlib.Path("assets") / (name + "." + ext)
              path.parent.mkdir(parents=True, exist_ok=True)
              if path.exists():
                  raise RuntimeError(f"Would overwrite existing asset {path}")
              path.write_bytes(payload)
              out_paths[name] = "/" + str(path)
              manifest.append({"old": source, "path": "/" + str(path), "size": len(payload),
                               "sha256": hashlib.sha256(payload).hexdigest(), "content_type": content_type})
          if len(set(out_paths.values())) != len(NAMES):
              raise RuntimeError("Mismatch in asset names")
          def local_for(url):
              return SITE + out_paths[name_for(url)]
          for path in paths:
              text = path.read_text(encoding="utf-8")
              before = text
              if str(path) == "build.py":
                  text = re.sub(r'(?m)^CDN = "https://images\.squarespace-cdn\.com/content/v1/6a6464a7513b006c5a13f402"\n', "", text)
                  for key, var in [("3a0d35ff-cf40-4f06-9450-b90b574a8301", "HEAD_LOGO"),
                                   ("2416aef0-200d-46e7-bf0f-f6e0e8497199", "LM_LOGO")]:
                      v = SITE + out_paths[NAMES[key]]
                      text, count = re.subn(r"(?m)^" + var + r" = CDN \+ [^\n]+\n", var + ' = "' + v + '"\n', text)
                      if count != 1:
                          raise RuntimeError(var + " missing in generator")
                  text = re.sub(r"\{CDN\}/[^\s\"']+", lambda m: local_for("https://images.squarespace-cdn.com/content/v1/6a6464a7513b006c5a13f402/" + m.group()[6:]), text)
                  text = text.replace("{m.group(1)}?format=1500w", "{m.group(1)}")
                  text = text.replace("{m['image']}?format=1500w", "{m['image']}")
                  text = text.replace('m["image"] + "?format=1500w"', 'm["image"]')
              def replace_url(m):
                  u = html.unescape(m.group()).rstrip("),.;")
                  trailing = m.group()[len(u):]
                  if u.endswith("/6a6464a7513b006c5a13f402"):
                      raise RuntimeError("Unexpected CDN base remaining in " + str(path))
                  return local_for(u) + trailing
              text = pattern.sub(replace_url, text)
              if text != before:
                  path.write_text(text, encoding="utf-8")
          # No non-Squarespace assets changed and no remote Squarespace image URL survives.
          remaining = []
          for path in paths:
              if pattern.search(path.read_text(encoding="utf-8")):
                  remaining.append(str(path))
          if remaining:
              raise RuntimeError("Remote image references remain: " + str(remaining))
          # Validate references and downloaded asset byte sizes from their exact upstream representations.
          for row in manifest:
              b = (ROOT / row["path"].lstrip("/")).read_bytes()
              assert len(b) == row["size"]
              assert hashlib.sha256(b).hexdigest() == row["sha256"]
          pathlib.Path("../squarespace-image-migration-manifest.json").write_text(json.dumps(manifest, indent=2))
          print("SUCCESS",len(manifest),"images",sum(x["size"] for x in manifest),"bytes")
          for row in manifest:
              print(row["path"],row["size"],row["sha256"][:12])
          
          PY
      - name: Commit migrated assets
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets build.py index.html 404.html contact legal-disclaimer privacy stories content history
          git diff --cached --quiet && exit 1
          git commit -m 'Vendor Squarespace images and update URLs'
          git push origin HEAD:fix/migrate-squarespace-images-20261024
